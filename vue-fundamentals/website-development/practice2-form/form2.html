<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="form2.css">
</head>
<body>
    <form>
     <h2>Love to here from You</h2>

    <div id="input-top">
        <label for="username">Username:</label><br>
        <input type="text" id="username" placeholder="Enter your username">
    </div>

    <div class="center">

    <div id="input-left">
        <label for="email">Email</label><br>
        <input type="text" placeholder="Enter your Email adress" id="email"><br><br>

        <label for="passw">Password</label><br><br>
        <input type="password" placeholder="Enter Your Password" id="passw"><br><br>

        <label for="course">Choose Course</label><br>
        <input type="file"><br><br>
    </div>

    <div id="input-right">
        <label for="father">Father Name</label><br>
        <input type="text"  id="father" placeholder="Enter your father name"><br><br>

        <label for="mother">Mother Name</label><br>
        <input type="text"  id="mother" placeholder="Enter your mother name"><br><br>

        <label for="date">Birth Date</label><br>
        <input type="date" id="date"><br><br>
    </div>
    
    </div>

    <div id="input-bottom">
        <label for="trade">Trade</label><br>
        <input type="radio" name="trade" id="trade" style="padding: 0em; width:20px;">SOD
        <input type="radio" name="trade" id="trade" style="padding: 0em; width:20px;">ETE
        <input type="radio" name="trade" id="trade" style="padding: 0em; width:20px;">NIT
        <input type="radio" name="trade" id="trade" style="padding: 0em; width:20px;">SCA <br>

        <label for="msg">Message</label><br>
        <textarea name="msg" id="msg"></textarea>
    </div><br>

    <div id="btn">
        <button type="submit" id="btn1">Submit</button>
        <button type="reset" id="btn2">Cancel</button>
    </div>
    </form>
</body>
</html>
